AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI scheduling reliability - FastAPI on Lambda (Strands Agent + Bedrock) behind API Gateway (HTTP API)

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
    Description: Bedrock model or inference-profile ID used by the Strands agent.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin (FastAPI middleware); set to the Amplify URL after first deploy.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 29            # API Gateway HTTP API integrations time out at 30s
    MemorySize: 512

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.main.handler
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          CORS_ORIGINS: !Ref AllowedOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        Any:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/{proxy+}', Method: ANY}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:   # cost guard: public endpoint, every /api/decide may invoke Bedrock
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
